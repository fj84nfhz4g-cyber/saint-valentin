<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine 💕</title>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #ffe6ec, #ffd6e3);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CARTES */
.card {
  background: white;
  width: 92vw;
  max-width: 380px;
  border-radius: 28px;
  padding: 22px 20px 26px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

/* TITRES */
h1 {
  margin: 5px 0 10px;
  color: #ff4f7b;
  font-size: 26px;
}

p {
  font-size: 17px;
  margin: 8px 0 16px;
}

/* IMAGES */
.photo {
  width: 100%;
  border-radius: 20px;
  margin: 10px 0 18px;
}

/* BOUTONS */
.buttons {
  position: relative;
  height: 90px;
}

button {
  border: none;
  padding: 14px 26px;
  font-size: 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.15s;
}

#yesBtn {
  background: #ff4f7b;
  color: white;
  box-shadow: 0 0 20px rgba(255,79,123,0.6);
}

#noBtn {
  position: absolute;
  background: #f1f1f1;
}

/* INPUT */
input {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  border-radius: 14px;
  border: 1px solid #ddd;
  margin-bottom: 16px;
}

/* CACHÉ */
.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="card" id="gate">
  <h1>Question importante 😌</h1>
  <p>C’est qui l’amour de ta vie ? 🫶🏼</p>
  <input id="answer" placeholder="Écris la réponse ici…" />
  <button id="validate" style="background:#ff4f7b;color:white;">Valider 💖</button>
</div>

<!-- PAGE 2 -->
<div class="card hidden" id="valentine">
  <h1>Aya 🫶🏼</h1>
  <p>Tu veux être ma Valentine,<br>la femme que j’aime ? 😘</p>

  <img src="IMG_5717.jpeg" class="photo" />

  <div class="buttons">
    <button id="yesBtn">OUI 🫶🏼</button>
    <button id="noBtn">NON 😘</button>
  </div>
</div>

<!-- PAGE 3 -->
<div class="card hidden" id="love">
  <h1>Je t’aime mon bb 🫶🏼😘🎉</h1>
  <p>Je kiffe que t’ai accepté d’être ma Valentine 💖</p>
  <img src="IMG_5718.jpeg" class="photo" />
</div>

<script>
function vibrate(ms = 100) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/* ACCÈS PRIVÉ */
document.getElementById("validate").onclick = () => {
  const val = document.getElementById("answer").value.trim().toLowerCase();
  if (val === "mirouane") {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("valentine").classList.remove("hidden");
    vibrate(200);
  } else {
    vibrate([100,50,100]);
    alert("Hmm… réfléchis bien 😏");
  }
};

/* NON QUI BOUGE */
const noBtn = document.getElementById("noBtn");
const box = document.querySelector(".buttons");

function moveNo() {
  const maxX = box.clientWidth - noBtn.offsetWidth;
  const maxY = box.clientHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
  vibrate(40);
}

setInterval(moveNo, 600);
noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* OUI */
document.getElementById("yesBtn").onclick = () => {
  vibrate([300,100,300,100,500]);
  document.getElementById("valentine").classList.add("hidden");
  document.getElementById("love").classList.remove("hidden");
};
</script>

</body>
</html>
